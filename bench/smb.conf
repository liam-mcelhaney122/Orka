# Samba configuration for the opt-in SMB bench.
#
# This is a template: every @BENCH_RUN@ placeholder is a directory
# `just bench-up` substitutes with an absolute path (bench/run/samba)
# before starting smbd, so smbd never touches system directories and
# needs no root privileges. `just bench-up` also creates the share
# directories and the "orka" user's password before smbd starts.
#
# smbd listens on a high port (4450), so it needs no privilege to
# bind it. This is Homebrew's samba (`brew install samba`), not the
# Apple-supplied smbd at /usr/sbin/smbd: Apple's smbd is a different,
# closed implementation that ignores this file.

[global]
    workgroup = WORKGROUP
    server string = Orka bench SMB
    netbios name = ORKABENCH
    security = user
    map to guest = Never
    guest account = @BENCH_USER@
    # Auth details in the log help diagnose a refused mount in CI.
    log level = 1
    passdb backend = tdbsam:@BENCH_RUN@/passdb.tdb
    smb passwd file = @BENCH_RUN@/smbpasswd
    private dir = @BENCH_RUN@/private
    lock directory = @BENCH_RUN@/lock
    state directory = @BENCH_RUN@/state
    cache directory = @BENCH_RUN@/cache
    pid directory = @BENCH_RUN@/pid
    log file = @BENCH_RUN@/log.smbd
    smb ports = 4450
    disable netbios = yes
    disable spoolss = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    server min protocol = SMB2
    server max protocol = SMB3

# A password-protected share. The current Unix user (password
# "orka-bench", registered by `just bench-up`) is the only one allowed in; `smb_password_login_meets_conformance`
# and `smb_workgroup_qualified_username_connects` in bench_mounts.rs
# use it.
[secure]
    path = @BENCH_RUN@/shares/secure
    read only = no
    valid users = @BENCH_USER@
    guest ok = no
    force user = @BENCH_USER@

# A guest-accessible share with no credentials at all.
# `smb_guest_share_connects_with_no_auth` uses it.
[guest]
    path = @BENCH_RUN@/shares/guest
    read only = no
    guest ok = yes
    force user = @BENCH_USER@
