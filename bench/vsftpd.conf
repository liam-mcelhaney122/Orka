# vsftpd configuration for the opt-in implicit-TLS FTPS bench.
#
# This is a template: every @BENCH_RUN@ placeholder is a directory
# `just bench-up` substitutes with an absolute path (bench/run/vsftpd)
# before starting vsftpd, and @BENCH_TLS@ is bench/tls, where
# `just bench-up` generates a throwaway certificate authority and
# server certificate with openssl.
#
# listen_port is 990 (the real, standard implicit-TLS FTPS port), not
# a high port: Orka's `is_implicit_tls_port` in
# `orka_core::vfs::ftp` keys on exactly 990, and the same
# `ConnectionConfig::port` also drives the real TCP dial, so there is
# no way to point Orka's implicit-TLS client at a remapped port. That
# means this daemon needs root to bind 990, so `just bench-up` starts
# it with `sudo` and treats it as optional: if `sudo -n` cannot run
# without a password prompt in the environment `just bench-up` runs
# in, it skips vsftpd and reports that the FTPS bench is unverified.
#
# Anonymous access, not a real system user account, keeps the bench
# self-contained: `AuthMethod::None` in the FTPS test logs in as
# "anonymous", and write access to the anonymous root lets the
# conformance suite round-trip files.

listen=YES
listen_port=990
# Fork and return so the recipe can continue. `just bench-down` finds
# the daemon by its config path; vsftpd has no pid file option.
background=YES
# macOS has no `ftp` account. The anonymous session runs as nobody.
ftp_username=nobody
nopriv_user=nobody
ssl_enable=YES
implicit_ssl=YES
rsa_cert_file=@BENCH_TLS@/cert.pem
rsa_private_key_file=@BENCH_TLS@/key.pem
allow_anon_ssl=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES

anonymous_enable=YES
local_enable=NO
anon_root=@BENCH_RUN@/anon
write_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
anon_umask=022
allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1

secure_chroot_dir=@BENCH_RUN@
log_file=@BENCH_RUN@/vsftpd.log
xferlog_enable=NO
