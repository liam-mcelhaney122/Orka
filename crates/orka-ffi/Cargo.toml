[package]
name = "orka-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "orka_ffi"
# staticlib links into the app; cdylib is only used by uniffi-bindgen.
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
orka-core = { path = "../orka-core" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
