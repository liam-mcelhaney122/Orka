[package]
name = "orka-core"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror = "2"
libc = "0.2"
notify = "8.2.0"
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
# vendored-libgit2 compiles the C library in; no system dependency.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
# FTP backend. "deprecated" unlocks connect_secure_implicit, needed for
# implicit-TLS FTPS (port 990); the FTP spec deprecated implicit TLS in
# favor of explicit AUTH TLS, but many servers still expect it on 990.
suppaftp = { version = "6", default-features = false, features = ["rustls", "deprecated"] }
# Trust roots for the FTPS TLS connector.
webpki-roots = "1"
# Builds the shared TLS root store (ftp.rs and http.rs) that adds an
# extra CA file on top of webpki-roots. Pinned to the "ring" backend,
# matching the version and provider ureq and suppaftp already pull
# in, so only one rustls build lands in the dependency tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Parses the PEM certificates in ORKA_EXTRA_CA_FILE.
rustls-pemfile = "2"
# REST file-server backends (Dropbox, Google Drive, ADLS) and their JSON.
ureq = { version = "2", features = ["json", "tls"] }
# Only for reading the URL a ureq transport error carries, so the
# error message can drop its query string (a SAS token can live
# there) instead of the crate's own URL parsing.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADLS Gen2 shared-key signing.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Cryptographically secure randomness for the OAuth PKCE verifier and
# the loopback redirect state parameter.
getrandom = "0.2"
# RS256 signing for a Google service-account JWT. Pure Rust; no system
# OpenSSL dependency, so vendored builds keep working. Trimmed to the
# features this backend actually needs: PEM parsing of the key file
# and SHA-256 for the RS256 signature.
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
# Archive support: zip, tar, and gzip tarballs.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
