[package]
name = "orka-bench"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.15"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "2", features = ["json", "tls"] }
