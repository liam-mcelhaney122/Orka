name: Orka
options:
  deploymentTarget:
    macOS: "26.0"
targets:
  Orka:
    type: application
    platform: macOS
    sources:
      - path: Orka
        excludes:
          - "orka-icon.svg"
      - path: Generated
        optional: true
    info:
      path: Orka/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orka.app
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Orka/Orka-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/../target/release"
        OTHER_LDFLAGS: "-lorka_ffi"
        # A stable identity keeps TCC grants (Full Disk Access)
        # across builds. Ad-hoc signatures lose them every build.
        # Developer ID is the identity for distribution outside the
        # App Store. Notarization requires Developer ID, the hardened
        # runtime, and a secure timestamp.
        # CI overrides these settings with ad-hoc signing when the
        # runner has no certificate.
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: GQK8MGC2AU
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
  OrkaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Orka/Model/OrkaPath.swift
      - path: Orka/Model/TransferKind.swift
      - path: Orka/Model/ConnectionStore.swift
      - path: Generated
        optional: true
      - path: OrkaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orka.tests
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Orka/Orka-Bridging-Header.h
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        # ConnectionStore.swift converts to the engine's generated
        # types, so the test bundle links the same Rust library as the
        # app target.
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/../target/release"
        OTHER_LDFLAGS: "-lorka_ffi"
schemes:
  OrkaTests:
    build:
      targets:
        OrkaTests: all
    test:
      targets:
        - OrkaTests
