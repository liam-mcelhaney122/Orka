name: Orka
options:
  deploymentTarget:
    macOS: "26.0"
targets:
  Orka:
    type: application
    platform: macOS
    sources:
      - path: Orka
        excludes:
          - "orka-icon.svg"
      - path: Generated
        optional: true
    info:
      path: Orka/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orka.app
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Orka/Orka-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/../target/release"
        OTHER_LDFLAGS: "-lorka_ffi"
        CODE_SIGN_IDENTITY: "-"
  OrkaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Orka/Model/OrkaPath.swift
      - path: Orka/Model/TransferKind.swift
      - path: OrkaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orka.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OrkaTests:
    build:
      targets:
        OrkaTests: all
    test:
      targets:
        - OrkaTests
