name: Release

# A pushed v* tag builds the app and publishes a GitHub release with
# the zipped Orka.app attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust core and generate Swift bindings
        run: ./scripts/build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: app

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project app/Orka.xcodeproj \
            -scheme OrkaTests \
            -destination 'platform=macOS'

      # Imports the Developer ID Application certificate into a throwaway
      # keychain scoped to this job. Notarization requires this identity;
      # "Apple Development" (used for local dev builds) cannot notarize.
      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/orka-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "ORKA_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Orka app (Release)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project app/Orka.xcodeproj \
            -scheme Orka \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      # Mirrors `just dist`: copy the build product out of DerivedData and
      # rewrite the Rust dylib's load path so the app runs on other Macs
      # (see scripts/package-app.sh for why).
      - name: Assemble dist/Orka.app
        env:
          ORKA_SIGN_IDENTITY: Developer ID Application
        run: |
          rm -rf dist/Orka.app
          mkdir -p dist
          ditto build/DerivedData/Build/Products/Release/Orka.app dist/Orka.app
          ./scripts/package-app.sh dist/Orka.app

      # Notarization needs its own throwaway zip (Apple inspects and
      # discards it); the release zip is built after stapling below.
      - name: Notarize app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"

          ditto -c -k --keepParent dist/Orka.app "$RUNNER_TEMP/Orka-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Orka-notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple dist/Orka.app
          rm -f "$KEY_PATH" "$RUNNER_TEMP/Orka-notarize.zip"

      - name: Zip the app
        run: |
          ditto -c -k --keepParent dist/Orka.app "Orka-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Orka-${GITHUB_REF_NAME}.zip" \
            --title "Orka $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${ORKA_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$ORKA_KEYCHAIN_PATH" || true
          fi
